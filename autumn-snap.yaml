            - text: Autumn
            - generic [ref=e11]: 秋
          - paragraph [ref=e12]: 秋天的拾遗者 · 中国 · autumn
          - paragraph [ref=e13]: 秋天是一年最好的季节：光变短了，颜色变浓了，风也学会了慢下来。这个小站收集了十九个秋天，和十九首可以慢慢读的诗。
          - heading "联系" [level=3] [ref=e14]
          - list
          - heading "明信片" [level=3] [ref=e15]
          - list [ref=e16]:
            - listitem [ref=e17]: "枫叶猫: 远上寒山石径斜，白云深处有人家。 停车坐爱枫林晚，霜叶红于二月花。 — 杜牧, 山间, 2025 年 10 月 5 日"
            - listitem [ref=e18]: "落叶野餐: 孤村落日残霞，轻烟老树寒鸦，一点飞鸿影下。 青山绿水，白草红叶黄花。 — 白朴, 村落, 2025 年 10 月 8 日"
            - listitem [ref=e19]: "秋日面包店: 早晨起来，泡一碗浓茶，向院子一坐，你也能看得到很高很高的碧绿的天色。 — 郁达夫, 故都, 2025 年 10 月 12 日"
            - listitem [ref=e20]: "银杏咖啡馆: 秋天的阳光醇厚柔润，在建筑物顶端闪闪发光。 — 村上春树, 窗边, 2025 年 10 月 15 日"
            - listitem [ref=e21]: "河畔牧羊: 月落乌啼霜满天，江枫渔火对愁眠。 姑苏城外寒山寺，夜半钟声到客船。 — 张继, 枫桥, 2025 年 10 月 18 日"
            - listitem [ref=e22]: "金色田野: 马穿山径菊初黄，信马悠悠野兴长。 棠梨叶落胭脂色，荞麦花开白雪香。 — 王禹偁, 村行, 2025 年 10 月 20 日"
            - listitem [ref=e23]: "湖畔独坐: 东皋薄暮望，徙倚欲何依。 树树皆秋色，山山唯落晖。 — 王绩, 东皋, 2025 年 10 月 23 日"
            - listitem [ref=e24]: "枫庭石径: 枯藤老树昏鸦，小桥流水人家。 古道西风瘦马，夕阳西下，断肠人在天涯。 — 马致远, 古道, 2025 年 10 月 26 日"
            - listitem [ref=e25]: "仰望秋空: 自古逢秋悲寂寥，我言秋日胜春潮。 晴空一鹤排云上，便引诗情到碧霄。 — 刘禹锡, 晴空, 2025 年 10 月 28 日"
            - listitem [ref=e26]: "红叶山门: 空山新雨后，天气晚来秋。 明月松间照，清泉石上流。 — 王维, 空山, 2025 年 10 月 30 日"
            - listitem [ref=e27]: "银杏画作: 闲来无事不从容，睡觉东窗日已红。 万物静观皆自得，四时佳兴与人同。 — 程颢, 东窗, 2025 年 11 月 2 日"
            - listitem [ref=e28]: "秋林落叶: 萧萧梧叶送寒声，江上秋风动客情。 知有儿童挑促织，夜深篱落一灯明。 — 叶绍翁, 篱落, 2025 年 11 月 5 日"
            - listitem [ref=e29]: "红叶舟游: 一道残阳铺水中，半江瑟瑟半江红。 可怜九月初三夜，露似真珠月似弓。 — 白居易, 江畔, 2025 年 11 月 8 日"
            - listitem [ref=e30]: "花间跃猫: 大概我所爱的不是晚秋，是初秋，那时暄气初消，月正圆，蟹正肥，桂花皎洁。 — 林语堂, 初秋, 2025 年 11 月 11 日"
            - listitem [ref=e31]: "秋夜灯笼: 君问归期未有期，巴山夜雨涨秋池。 何当共剪西窗烛，却话巴山夜雨时。 — 李商隐, 巴山, 2025 年 11 月 14 日"
            - listitem [ref=e32]: "屋檐猫眠: 只有一枝梧叶，不知多少秋声！ — 张炎, 梧叶, 2025 年 11 月 16 日"
            - listitem [ref=e33]: "银杏小熊: 秋风清，秋月明，落叶聚还散，寒鸦栖复惊。 — 李白, 月下, 2025 年 11 月 19 日"
            - listitem [ref=e34]: "窗边读书: 在秋天，水和蓝天一样的清凉。天上微微有些白云，水上微微有些波皱。 — 老舍, 济南, 2025 年 11 月 22 日"
            - listitem [ref=e35]: "枫叶小猫: 路边全是高高的杨树，风过处无数落叶就如一场黄金雨从天顶飘落。 — 王小波, 路边, 2025 年 11 月 25 日"
